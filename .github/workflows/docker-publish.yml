name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/node-postgres-multi-tier-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/node-postgres-multi-tier-api:${{ github.sha }}
      
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: node-postgres-api
          resourceGroup: rg-products-api
          imageToDeploy: ${{ secrets.DOCKERHUB_USERNAME }}/node-postgres-multi-tier-api:${{ github.sha }}